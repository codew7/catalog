# Publica el sitio en GitHub Pages cada vez que se sube algo a main.
# Antes de publicar cambia "?v=dev" por la versión del commit en los .html y
# .js: cada publicación tiene direcciones de archivo nuevas, así el navegador
# de los clientes nunca mezcla una página nueva con un archivo viejo en caché.
# Requiere (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Marcar la versión en los archivos
        run: |
          V="${GITHUB_SHA::8}"
          mkdir -p _sitio
          rsync -a --exclude '.git' --exclude '.github' --exclude '_sitio' ./ _sitio/
          find _sitio -maxdepth 1 \( -name '*.html' -o -name '*.js' \) -exec sed -i "s/?v=dev/?v=$V/g" {} +
          echo "Versión publicada: $V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
