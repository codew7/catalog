<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Cargando…</title>
    <!-- ======================================================================
         404.HTML · direcciones limpias por tienda
         GitHub Pages (y la mayoría de los hostings estáticos) devuelve este
         archivo para cualquier dirección que no existe. Lo usamos para:
           /lucia          → catálogo de la tienda "lucia"  (index.html?t=lucia)
           /lucia/admin    → panel de la tienda "lucia"     (admin.html?tienda=lucia)
         En GitHub Pages sin dominio propio el sitio vive en una subcarpeta
         (codew7.github.io/catalog/), que se detecta sola.
         ====================================================================== -->
    <script>
        (function () {
            var segs = location.pathname.split('/').filter(Boolean).map(function (s) {
                try { return decodeURIComponent(s).toLowerCase(); } catch (e) { return s.toLowerCase(); }
            });
            var base = '/';
            if (/\.github\.io$/i.test(location.hostname) && segs.length) base = '/' + segs.shift() + '/';

            var id = segs[0] || '';
            var extra = segs[1] || '';
            var reservados = ['admin', 'principal', 'index', 'api', 'img', 'assets', 'www', 'catalogo', 'tienda', 'registro'];
            if (/^[a-z0-9][a-z0-9-]{1,30}$/.test(id) && reservados.indexOf(id) < 0) {
                var resto = location.search ? '&' + location.search.slice(1) : '';
                var destino = extra === 'admin'
                    ? base + 'admin.html?tienda=' + id + resto
                    : base + '?t=' + id + resto;
                location.replace(destino + location.hash);
                return;
            }
            document.addEventListener('DOMContentLoaded', function () {
                document.title = 'Página no encontrada';
                document.getElementById('nf').hidden = false;
            });
        })();
    </script>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f4f5f7; color: #111827; }
        @media (prefers-color-scheme: dark) { body { background: #0c0d0f; color: #f4f5f6; } }
        div { text-align: center; max-width: 420px; }
        h1 { font-size: 1.3rem; margin: 0 0 8px; }
        p { margin: 0; opacity: .7; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="nf" hidden>
        <h1>Página no encontrada</h1>
        <p>Revisá la dirección: puede que el enlace esté incompleto.</p>
    </div>
</body>
</html>
